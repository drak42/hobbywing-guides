<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="250" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Connecting the HW Link V2 app</text>
<rect x="20" y="70" width="130" height="70" rx="8" fill="#1a5fb4"/><text x="85" y="102.0" text-anchor="middle" font-size="13" fill="#fff">Switch the</text><text x="85" y="118.0" text-anchor="middle" font-size="13" fill="#fff">ESC on</text>
<line x1="150" y1="105" x2="166" y2="105" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="168" y="70" width="130" height="70" rx="8" fill="#1a5fb4"/><text x="233" y="102.0" text-anchor="middle" font-size="13" fill="#fff">Open HW Link V2</text><text x="233" y="118.0" text-anchor="middle" font-size="13" fill="#fff">choose Bluetooth</text>
<line x1="298" y1="105" x2="314" y2="105" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="316" y="70" width="130" height="70" rx="8" fill="#1a5fb4"/><text x="381" y="102.0" text-anchor="middle" font-size="13" fill="#fff">Tap ESC icon</text><text x="381" y="118.0" text-anchor="middle" font-size="13" fill="#fff">pick HW_BLE****</text>
<line x1="446" y1="105" x2="462" y2="105" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="464" y="70" width="130" height="70" rx="8" fill="#1a5fb4"/><text x="529" y="102.0" text-anchor="middle" font-size="13" fill="#fff">Password</text><text x="529" y="118.0" text-anchor="middle" font-size="13" fill="#fff">888888</text>
<line x1="594" y1="105" x2="610" y2="105" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="612" y="70" width="130" height="70" rx="8" fill="#1a5fb4"/><text x="677" y="102.0" text-anchor="middle" font-size="13" fill="#fff">Parameters</text><text x="677" y="118.0" text-anchor="middle" font-size="13" fill="#fff">change and save</text>
<text x="380" y="180" text-anchor="middle" font-size="13" fill="#444">Also in the app: firmware update · factory reset · real-time data (where supported, ~0–5 m)</text>
<text x="380" y="205" text-anchor="middle" font-size="13" fill="#c0392b">AXE R2: run automatic motor pairing after any firmware update</text>
<text x="380" y="230" text-anchor="middle" font-size="13" fill="#444">Won't connect? Close the app, power-cycle the ESC, check Bluetooth/location permissions</text>
</svg>

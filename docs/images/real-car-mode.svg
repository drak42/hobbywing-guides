<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="280" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Real car mode (WP 1080 G2)</text>
<rect x="40" y="70" width="200" height="70" rx="8" fill="#c0392b"/><text x="140" y="101.5" text-anchor="middle" font-size="14" fill="#fff">Trigger pushed</text><text x="140" y="118.5" text-anchor="middle" font-size="14" fill="#fff">= always brake</text>
<rect x="280" y="70" width="200" height="70" rx="8" fill="#1a5fb4"/><text x="380" y="102.0" text-anchor="middle" font-size="13" fill="#fff">AUX switch (white cable)</text><text x="380" y="118.0" text-anchor="middle" font-size="13" fill="#fff">= forward / backward</text>
<rect x="520" y="70" width="200" height="70" rx="8" fill="#2e8b57"/><text x="620" y="102.0" text-anchor="middle" font-size="13" fill="#fff">Trigger pulled</text><text x="620" y="118.0" text-anchor="middle" font-size="13" fill="#fff">= drive in that direction</text>
<path d="M120,230 L360,180 L600,180" stroke="#888" stroke-width="10" fill="none"/>
<text x="220" y="225" text-anchor="middle" font-size="12" fill="#555">steep descent</text>
<rect x="320" y="150" width="60" height="28" rx="6" fill="#e07b39"/>
<text x="380" y="260" text-anchor="middle" font-size="13" fill="#444">Descend with gentle brake; if brake alone won't hold, flip direction and use light throttle uphill.</text>
</svg>

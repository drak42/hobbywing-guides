<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="410" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Running modes compared</text>
<text x="20" y="52" text-anchor="start" font-size="14" fill="#222" font-weight="bold">Forward and Reverse (crawler, single-click)</text><line x1="20" y1="80" x2="740" y2="80" stroke="#ccc"/><rect x="20" y="60" width="120" height="40" rx="6" fill="#888"/><text x="80" y="85.0" text-anchor="middle" font-size="12" fill="#fff">push trigger</text><rect x="170" y="60" width="120" height="40" rx="6" fill="#e07b39"/><text x="230" y="85.0" text-anchor="middle" font-size="12" fill="#fff">REVERSE</text><text x="740" y="118" text-anchor="end" font-size="12" fill="#555">reverses immediately</text>
<text x="20" y="142" text-anchor="start" font-size="14" fill="#222" font-weight="bold">Forward/Reverse with Brake (double-click)</text><line x1="20" y1="170" x2="740" y2="170" stroke="#ccc"/><rect x="20" y="150" width="120" height="40" rx="6" fill="#888"/><text x="80" y="175.0" text-anchor="middle" font-size="12" fill="#fff">1st push</text><rect x="170" y="150" width="120" height="40" rx="6" fill="#c0392b"/><text x="230" y="175.0" text-anchor="middle" font-size="12" fill="#fff">BRAKE</text><rect x="320" y="150" width="120" height="40" rx="6" fill="#bbb"/><text x="380" y="175.0" text-anchor="middle" font-size="12" fill="#fff">back to neutral</text><rect x="470" y="150" width="120" height="40" rx="6" fill="#888"/><text x="530" y="175.0" text-anchor="middle" font-size="12" fill="#fff">2nd push</text><rect x="620" y="150" width="120" height="40" rx="6" fill="#e07b39"/><text x="680" y="175.0" text-anchor="middle" font-size="12" fill="#fff">REVERSE</text><text x="740" y="208" text-anchor="end" font-size="12" fill="#555">reverses only once stopped</text>
<text x="20" y="232" text-anchor="start" font-size="14" fill="#222" font-weight="bold">RPM matching (Fusion; AXE "RPM/throttle matching")</text><line x1="20" y1="260" x2="740" y2="260" stroke="#ccc"/><rect x="20" y="240" width="120" height="40" rx="6" fill="#888"/><text x="80" y="265.0" text-anchor="middle" font-size="12" fill="#fff">same trigger</text><rect x="170" y="240" width="120" height="40" rx="6" fill="#bbb"/><text x="230" y="265.0" text-anchor="middle" font-size="12" fill="#fff">rock: load ↑</text><rect x="320" y="240" width="120" height="40" rx="6" fill="#1a5fb4"/><text x="380" y="265.0" text-anchor="middle" font-size="12" fill="#fff">ESC adds torque</text><rect x="470" y="240" width="120" height="40" rx="6" fill="#2e8b57"/><text x="530" y="265.0" text-anchor="middle" font-size="12" fill="#fff">speed held</text><text x="740" y="298" text-anchor="end" font-size="12" fill="#555">normal mode would slow down instead</text>
<text x="20" y="322" text-anchor="start" font-size="14" fill="#222" font-weight="bold">Real car mode (WP 1080 G2)</text><line x1="20" y1="350" x2="740" y2="350" stroke="#ccc"/><rect x="20" y="330" width="120" height="40" rx="6" fill="#888"/><text x="80" y="355.0" text-anchor="middle" font-size="12" fill="#fff">push trigger</text><rect x="170" y="330" width="120" height="40" rx="6" fill="#c0392b"/><text x="230" y="355.0" text-anchor="middle" font-size="12" fill="#fff">ALWAYS BRAKE</text><rect x="320" y="330" width="120" height="40" rx="6" fill="#bbb"/><text x="380" y="355.0" text-anchor="middle" font-size="12" fill="#fff">AUX switch</text><rect x="470" y="330" width="120" height="40" rx="6" fill="#1a5fb4"/><text x="530" y="355.0" text-anchor="middle" font-size="12" fill="#fff">flips direction</text><text x="740" y="388" text-anchor="end" font-size="12" fill="#555">throttle then drives forward or back</text>
</svg>

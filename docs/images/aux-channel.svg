<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="290" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Live adjustment from a spare radio channel</text>
<rect x="40" y="80" width="180" height="90" rx="8" fill="#555"/><text x="130" y="122.0" text-anchor="middle" font-size="13" fill="#fff">Fusion Pro Elite</text><text x="130" y="138.0" text-anchor="middle" font-size="13" fill="#fff">switch + yellow cable</text>
<rect x="300" y="80" width="170" height="90" rx="8" fill="#2b2b2b"/><text x="385" y="130.0" text-anchor="middle" font-size="14" fill="#fff">Receiver</text>
<rect x="540" y="80" width="180" height="90" rx="8" fill="#1a5fb4"/><text x="630" y="122.0" text-anchor="middle" font-size="13" fill="#fff">Transmitter</text><text x="630" y="138.0" text-anchor="middle" font-size="13" fill="#fff">knob / dial</text>
<path d="M220,140 C260,140 260,150 300,150" stroke="#f1c40f" stroke-width="4" fill="none"/>
<text x="260" y="190" text-anchor="middle" font-size="12" fill="#444">yellow → AUX channel</text>
<path d="M220,105 C260,105 260,110 300,110" stroke="#fff" stroke-width="4" fill="none"/>
<path d="M220,105 C260,105 260,110 300,110" stroke="#555" stroke-width="1" fill="none"/>
<text x="260" y="75" text-anchor="middle" font-size="12" fill="#444">throttle → TH channel</text>
<path d="M470,125 Q505,95 540,125" stroke="#555" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
<text x="505" y="90" text-anchor="middle" font-size="12" fill="#555">radio</text>
<text x="380" y="230" text-anchor="middle" font-size="13" fill="#444">Item 14 chooses what the knob adjusts (default: item 7, drag brake force).</text>
<text x="380" y="252" text-anchor="middle" font-size="13" fill="#444">Knob at max = strongest setting, decreasing linearly to the minimum.</text>
<text x="380" y="274" text-anchor="middle" font-size="13" fill="#1a5fb4">WP 1080 G2: yellow cable = live drag brake · white cable = real-car direction switch</text>

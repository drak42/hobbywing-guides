<svg xmlns="http://www.w3.org/2000/svg" width="760" height="235" viewBox="0 0 760 235" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="235" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Throttle range calibration</text>
<rect x="15" y="60" width="138" height="70" rx="8" fill="#9a9a9a"/><text x="84" y="92.5" text-anchor="middle" font-size="12" fill="#fff">Radio: EPA 100 %</text><text x="84" y="107.5" text-anchor="middle" font-size="12" fill="#fff">trim 0, fail-safe</text>
<line x1="153" y1="95" x2="163" y2="95" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="165" y="60" width="138" height="70" rx="8" fill="#9a9a9a"/><text x="234" y="92.5" text-anchor="middle" font-size="12" fill="#fff">Enter calibration</text><text x="234" y="107.5" text-anchor="middle" font-size="12" fill="#fff">(see below)</text>
<line x1="303" y1="95" x2="313" y2="95" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="315" y="60" width="138" height="70" rx="8" fill="#e07b39"/><text x="384" y="92.5" text-anchor="middle" font-size="12" fill="#fff">Neutral → press</text><text x="384" y="107.5" text-anchor="middle" font-size="12" fill="#fff">1 flash, 1 beep</text>
<line x1="453" y1="95" x2="463" y2="95" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="465" y="60" width="138" height="70" rx="8" fill="#e07b39"/><text x="534" y="92.5" text-anchor="middle" font-size="12" fill="#fff">Full throttle → press</text><text x="534" y="107.5" text-anchor="middle" font-size="12" fill="#fff">2 flashes, 2 beeps</text>
<line x1="603" y1="95" x2="613" y2="95" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="615" y="60" width="138" height="70" rx="8" fill="#e07b39"/><text x="684" y="92.5" text-anchor="middle" font-size="12" fill="#fff">Full reverse → press</text><text x="684" y="107.5" text-anchor="middle" font-size="12" fill="#fff">3 flashes, 3 beeps</text>
<text x="380" y="165" text-anchor="middle" font-size="13" fill="#444">Fusion Pro / Fusion Pro Elite: ESC off → hold the power button → release as soon as the red LED flashes (within 8 s)</text>
<text x="380" y="188" text-anchor="middle" font-size="13" fill="#444">AXE R2 / WP 1080 G1 / G2: hold SET → press ON/OFF → release SET as soon as the red LED flashes (within 3 s)</text>
<text x="380" y="215" text-anchor="middle" font-size="13" fill="#1a5fb4">Redo after a new radio or receiver, trim/EPA changes, factory reset or firmware change</text>
</svg>
